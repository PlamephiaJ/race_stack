/**:
  ros__parameters:
    # Minimum recovery CAP; lower path/trailing/stop requests still take priority.
    recovery_speed_mps: 0.5
    # Toward/parallel to path: interpolate from requested speed to the crawl cap.
    recovery_full_speed_distance_m: 0.35
    recovery_min_speed_distance_m: 1.5
    recovery_full_speed_heading_deg: 25.0
    recovery_min_speed_heading_deg: 90.0
    # Allow small outward heading noise; reversed/diverging motion uses crawl cap.
    recovery_direction_tolerance_deg: 10.0
    # Smooth the interpolated cap in both directions; wrong direction caps at 0.5.
    recovery_release_accel_mps2: 1.0

    # Pure linear collision-distance speed; no TTC/stop/release thresholds.
    front_clearance_m: 0.30
    collision_speed_gain: 0.8  # v = 0.8 * max(current_distance - 0.30, 0)
    speed_accel_mps2: 1.0
    speed_decel_mps2: 1.0
