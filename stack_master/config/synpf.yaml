# ForzaETH SynPF 85ecc1865ac687ad8cf31afadbcb826acb23262c (ROS 2 port).
# sigma_hit is in metres. GPU is mandatory; TUM is the upstream default.
synpf:
  ros__parameters:
    scan_topic: /scan
    odometry_topic: /state_estimation/odom
    odom_frame: odom
    base_frame: base_link
    laser_global_pose_topic: /pf/laser_global_pose
    angle_step: 18
    max_particles: 3000
    squash_factor: 2.2
    viz: 1
    max_viz_particles: 50
    visualization_update_period: 0.2
    range_method: rmgpu
    theta_discretization: 150
    max_range: 20
    fine_timing: 0
    z_short: 0.1
    z_max: 0.025
    z_rand: 0.025
    z_hit: 0.85
    sigma_hit: 0.1
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    rangelib_variant: 2
    des_lidar_beams: 21
    initial_var_x: 0.5
    initial_var_y: 0.5
    initial_var_theta: 0.4
    lambda_short: 0.25
    motion_model: tum
    alpha_1_tum: 0.5
    alpha_2_tum: 0.015
    alpha_3_tum: 1.0
    alpha_4_tum: 0.1
    lam_thresh: 0.1
    alpha_1_amcl: 0.5
    alpha_2_amcl: 0.5
    alpha_3_amcl: 1.0
    alpha_4_amcl: 0.1
    motion_dispersion_arc_x: 0.8
    motion_dispersion_arc_y: 1.0
    motion_dispersion_arc_theta: 0.75
    motion_dispersion_arc_xy: 1.0
    motion_dispersion_arc_x_min: 0.01
    motion_dispersion_arc_y_min: 0.03
    motion_dispersion_arc_y_max: 1.0
    motion_dispersion_arc_theta_min: 0.01
    motion_dispersion_arc_xy_min_x: 0.1
    lidar_aspect_ratio: 3.5
    pose_pub_topic: /tracked_pose
    pub_covariance: true
    out_of_map_weight: 0.01
