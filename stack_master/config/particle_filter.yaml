particle_filter:
  ros__parameters:
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/state_estimation/odom'
    odom_frame: 'odom'
    base_frame: 'base_link'
    # Observation output: pose of the laser frame expressed in the map frame.
    laser_global_pose_topic: '/pf/laser_global_pose'
    # range data downsampling
    angle_step: 18
    max_particles: 4000
    squash_factor: 2.2
    # visualization
    viz: 1
    max_viz_particles: 60
    # Publish pose/particles/fake scan to RViz at most at 5 Hz. MCL and TF are unchanged.
    visualization_update_period: 0.2
    # ray marching method
    range_method: 'rmgpu'  # Required: CUDA RangeLibc; never fall back to CPU
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2

